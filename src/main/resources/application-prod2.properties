# Configuração de Base de Dados - PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}/${POSTGRES_DB}?createDatabaseIfNotExists=true&serverTimezone=UTC
spring.datasource.username=${POSTGRES_USER:bcr}
spring.datasource.password=${POSTGRES_PASSWORD:gmSenai}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA / Hibernate
# Com versões atuais do Hibernate, normalmente não é necessário informar o dialect.
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Criação das tabelas
spring.jpa.hibernate.ddl-auto=create

# import.sql
# O Hibernate executará import.sql quando ddl-auto estiver em create/create-drop.
#spring.sql.init.mode=always
#spring.sql.init.data-locations=classpath:import.sql

# Show SQLspring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=false